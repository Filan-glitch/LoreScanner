name: lorescanner
description: "A scanner application for the Lorcana TCG by Ravensburger"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.12.0+2
  path: ^1.9.1
  path_provider: ^2.1.5
  google_mlkit_text_recognition: ^0.16.0
  dart_mappable: ^4.5.0
  url_launcher: ^6.3.1
  flutter_native_splash: ^2.4.1
  cached_network_image: ^3.3.1
  share_plus: ^13.2.0
  flutter_riverpod: ^2.6.1
  drift: ^2.26.0
  drift_flutter: ^0.3.1
  sqlite3: ^3.4.0
  http: ^1.3.0
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  dart_mappable_builder: ^4.5.0
  drift_dev: ^2.26.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/icon.png